name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest packages/shutong/tests/ -v --tb=short
        env:
          SHUTONG_CORPUS_ROOT: ./corpus
          SHUTONG_LIBRARY_ROOT: ./library
          SHUTONG_GLOSSARY_DIR: ./.shutong/glossary

      - name: Check import works
        run: uv run python -c "from shutong.mcp_server import TOOL_DEFINITIONS; print(f'{len(TOOL_DEFINITIONS)} tools registered')"